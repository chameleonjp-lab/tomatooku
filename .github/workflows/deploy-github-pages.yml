name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tomatooku-github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify and package static game
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout GitHub main
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static and contract tests
        run: npm test

      - name: Prepare public files
        run: node scripts/prepare-github-pages.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    name: Publish verified static game
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Check this is still the production branch head
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const ref = await github.rest.git.getRef({
              ...context.repo, ref: 'heads/main'
            });
            core.setOutput('current', ref.data.object.sha === context.sha);
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.current.outputs.current == 'true'
        uses: actions/deploy-pages@v4
