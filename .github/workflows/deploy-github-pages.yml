name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tomatooku-github-pages
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: verify
    permissions:
      contents: read
      pages: write
    name: Verify and package static game
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout GitHub main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require verified Pages Source and current main
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/pages-release-gate.cjs')({ github, context });

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static and contract tests
        run: npm test

      - name: Prepare public files
        run: node scripts/prepare-github-pages.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: Publish verified static game
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck Pages Source and current main before deployment
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/pages-release-gate.cjs')({ github, context });
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
